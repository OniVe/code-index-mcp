name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Публичный code-index — без BSL/1С специфики и без LLM-фич.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            crate: code-index
            features: ''
            artifact: code-index.exe
            archive: code-index-windows-x64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            crate: code-index
            features: ''
            artifact: code-index
            archive: code-index-linux-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            crate: code-index
            features: ''
            artifact: code-index
            archive: code-index-macos-arm64.tar.gz

          # bsl-indexer — приватная сборка с feature `enrichment` (LLM-обогащение).
          # Если в будущем добавим feature `embeddings` (этап 5b) — здесь
          # дополнить как `enrichment,embeddings`. См. карточку 262 (модель
          # распространения) и docs/bsl-indexer.md.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            crate: bsl-indexer
            features: enrichment
            artifact: bsl-indexer.exe
            archive: bsl-indexer-windows-x64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            crate: bsl-indexer
            features: enrichment
            artifact: bsl-indexer
            archive: bsl-indexer-linux-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            crate: bsl-indexer
            features: enrichment
            artifact: bsl-indexer
            archive: bsl-indexer-macos-arm64.tar.gz

          # code-index-guard — хук PreToolUse для Claude Code и Codex CLI:
          # отдельный маленький бинарник, от ядра не зависит.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            crate: code-index-guard
            features: ''
            artifact: code-index-guard.exe
            archive: code-index-guard-windows-x64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            crate: code-index-guard
            features: ''
            artifact: code-index-guard
            archive: code-index-guard-linux-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            crate: code-index-guard
            features: ''
            artifact: code-index-guard
            archive: code-index-guard-macos-arm64.tar.gz

          # code-index-copy — копия проекта вместе с готовым индексом.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            crate: code-index-copy
            features: ''
            artifact: code-index-copy.exe
            archive: code-index-copy-windows-x64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            crate: code-index-copy
            features: ''
            artifact: code-index-copy
            archive: code-index-copy-linux-x64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            crate: code-index-copy
            features: ''
            artifact: code-index-copy
            archive: code-index-copy-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}

      # Linux: сборка под glibc 2.17 через cargo-zigbuild. Обычная сборка на
      # ubuntu-latest требует glibc этого образа (2.39) и не запускается на
      # Ubuntu 22.04 и других более старых системах. 2.17 — нижняя граница,
      # которую поддерживает Rust; выходной каталог — тот же target/<target>/release.
      - name: Install zig (Linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary
        shell: bash
        run: |
          FEATURES=""
          if [ -n "${{ matrix.features }}" ]; then
            FEATURES="--features ${{ matrix.features }}"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}.2.17 -p ${{ matrix.crate }} $FEATURES
          else
            cargo build --release --target ${{ matrix.target }} -p ${{ matrix.crate }} $FEATURES
          fi

      - name: Check glibc requirement (Linux)
        if: runner.os == 'Linux'
        run: |
          NEED=$(objdump -T "target/${{ matrix.target }}/release/${{ matrix.artifact }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "${{ matrix.artifact }} требует ${NEED}"
          if [ "$(printf '%s\nGLIBC_2.17\n' "$NEED" | sort -V | tail -1)" != "GLIBC_2.17" ]; then
            echo "::error::${{ matrix.artifact }} требует ${NEED} — новее GLIBC_2.17"
            exit 1
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}"

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Описание выпуска берём из журнала изменений: автосводка GitHub собирает
      # список запросов на слияние, а здесь коммиты идут прямо в ветку — она
      # выходила пустой, и страница выпуска не говорила, что исправлено.
      - name: Build release notes from changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" > release-notes.md <<'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG_EN.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", text, re.M | re.S)
          if m:
              print(m.group(0).strip())
              print()
              print("Russian version of the changelog: [CHANGELOG.md](CHANGELOG.md).")
          else:
              print(f"See [CHANGELOG_EN.md](CHANGELOG_EN.md) for {version}.")
          PY
          echo "--- release notes ---"
          head -5 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: artifacts/*
